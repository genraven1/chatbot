# TEMPLATE ONLY — do not commit a real key.
#
# Preferred: create the Secret out-of-band instead of applying this file:
#
#   kubectl create secret generic cart-recovery-secrets \
#     --from-literal=LITELLM_API_KEY='sk-...'
#
# Production: store the key in AWS Secrets Manager and sync it with the
# External Secrets Operator (with IRSA), so no secret value lives in git.
apiVersion: v1
kind: Secret
metadata:
  name: cart-recovery-secrets
  labels:
    app: cart-recovery
type: Opaque
stringData:
  LITELLM_API_KEY: "REPLACE_WITH_LITELLM_API_KEY"
