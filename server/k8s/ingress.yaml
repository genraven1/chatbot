# Exposes the service through an AWS Application Load Balancer.
# Requires the AWS Load Balancer Controller to be installed on the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cart-recovery
  labels:
    app: cart-recovery
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cart-recovery
                port:
                  number: 80
