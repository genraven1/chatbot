apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-recovery
  labels:
    app: cart-recovery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-recovery
  template:
    metadata:
      labels:
        app: cart-recovery
    spec:
      containers:
        - name: cart-recovery
          # Replace with your ECR image URI, e.g.
          # 123456789012.dkr.ecr.us-east-1.amazonaws.com/cart-recovery:0.1.0
          image: REPLACE_WITH_ECR_IMAGE_URI
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Non-secret config + the API key, injected as environment variables.
          envFrom:
            - configMapRef:
                name: cart-recovery-config
            - secretRef:
                name: cart-recovery-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 20
            periodSeconds: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Embedded Tomcat needs a writable temp dir under a read-only rootfs.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
